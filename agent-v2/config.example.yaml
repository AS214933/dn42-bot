host: "0.0.0.0"
port: 54321
secret: "secret_token"
open: true
max_peers: 0
min_peer_requirement: 0

net_support:
  ipv4: true
  ipv6: true
  ipv4_nat: false
  cn: false

extra_msg: ""
my_dn42_link_local_address: "fe80::1816"
my_dn42_ula_address: "fd2c:1323:4042::1"
my_dn42_ipv4_address: "172.23.246.1"
my_wg_public_key: "LUwqKS6QrCPv510Pwt1eAIiHACYDsbMjrkrbGTJfviU="
sentry_dsn: ""
bird_ctl_path: "/var/run/bird/bird.ctl"
bird_table_4: "master4"
bird_table_6: "master6"
vnstat_auto_add: true
vnstat_auto_remove: false
default_mtu: 1420
server_url: ""

# Optional DNS servers for built-in ping/trace/tcping hostname resolution.
# Configured servers are also used for native trace rDNS/PTR lookups.
# Accepts IP, IP:port, or [IPv6]:port. Empty list uses system DNS for hostname resolution.
dns_servers: []

# Optional bird-lg-go proxy-compatible endpoints on the agent API port.
# The feature is disabled by default. allowed_cidrs accepts CIDR/single-IP
# entries and the selectors any, public, private, and dn42. An empty allowed
# list denies every source; disallowed_cidrs always takes priority.
looking_glass:
  enabled: false
  allowed_cidrs: []
  disallowed_cidrs: []
  traceroute_enabled: true
  bird_max_concurrent: 16
  traceroute_max_concurrent: 10
  request_timeout: "15s"
  max_query_length: 4096
  max_output_bytes: 65536

# Manual update endpoints always use this configuration. Set enabled=true to
# let the agent periodically install newer GitHub release binaries by itself.
# Channel "candidate" includes prereleases such as alpha/beta/rc; "stable"
# only follows non-prerelease releases.
auto_update:
  enabled: false
  channel: "candidate"
  check_interval: "24h"
  repository: "AS214933/dn42-bot"
  data_dir: "/etc/dn42-agent"
  agent_path: "/etc/dn42-agent/agent"
  service_name: "dn42-agent.service"
  service_path: "/etc/systemd/system/dn42-agent.service"
