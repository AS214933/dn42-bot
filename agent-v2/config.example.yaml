host: "0.0.0.0"
port: 54321
secret: "secret_token"
open: true
max_peers: 0
min_peer_requirement: 0

net_support:
  ipv4: true
  ipv6: true
  ipv4_nat: false
  cn: false

extra_msg: ""
my_dn42_link_local_address: "fe80::1816"
my_dn42_ula_address: "fd2c:1323:4042::1"
my_dn42_ipv4_address: "172.23.246.1"
my_wg_public_key: "LUwqKS6QrCPv510Pwt1eAIiHACYDsbMjrkrbGTJfviU="
sentry_dsn: ""
bird_ctl_path: "/var/run/bird/bird.ctl"
bird_table_4: "master4"
bird_table_6: "master6"
vnstat_auto_add: true
vnstat_auto_remove: false
default_mtu: 1420
server_url: ""

# Optional DNS servers for built-in ping/trace/tcping hostname resolution.
# Configured servers are also used for native trace rDNS/PTR lookups.
# Accepts IP, IP:port, or [IPv6]:port. Empty list uses system DNS for hostname resolution.
dns_servers: []

# Optional bird-lg-go proxy-compatible endpoints on the agent API port.
# The feature is disabled by default. allowed_cidrs accepts CIDR/single-IP
# entries and the selectors any, public, private, and dn42. An empty allowed
# list denies every source; disallowed_cidrs always takes priority.
looking_glass:
  enabled: false
  allowed_cidrs: []
  disallowed_cidrs: []
  traceroute_enabled: true
  bird_max_concurrent: 16
  traceroute_max_concurrent: 10
  request_timeout: "15s"
  max_query_length: 4096
  max_output_bytes: 65536

# Optional DN42 Peer Finder measurement agent. This is a separate TCP listener
# and must not reuse the main agent API port above.
peerfinder:
  enabled: false
  host: "::"
  port: 9000
  secret_key: ""
  # secret_key_file: "/etc/dn42-agent/peerfinder.key"

# Optional DN42 BGP/WireGuard configuration backup. When enabled, agent-v2
# periodically snapshots /etc/bird and /etc/wireguard into a private Forgejo/
# Gitea repository. Use POST /backup/install for initial setup. Existing
# shell-based bgp-backup installations are migrated automatically at startup.
#
# Sync is bidirectional and remote-authoritative: human edits made through the
# Git web UI always win conflicts, and merged remote content is applied back
# onto /etc (BIRD reload + wg-quick up for interfaces that are not yet up).
#
# Unattended bootstrap: fill in node_name/git_instance/git_org/api_token and a
# fresh node self-installs on startup. If the remote repository already exists
# (e.g. you migrated this agent to a new machine), the backup is pulled back
# onto /etc and WireGuard/BIRD restart; otherwise the repo is created from the
# current local configuration. All four fields are required together.
backup:
  enabled: false
  state_file: "/etc/dn42-agent/backup.yaml"
  work_dir: "/var/lib/dn42-agent/backup"
  bird_dir: "/etc/bird"
  wireguard_dir: "/etc/wireguard"
  interval: "5m"
  on_boot_delay: "3m"
  random_delay: "30s"
  # node_name: "cn01"
  # git_instance: "https://git.example.com"
  # git_org: "dn42-backup"
  # api_token: ""

# Manual update endpoints always use this configuration. Set enabled=true to
# let the agent periodically install newer GitHub release binaries by itself.
# Channel "candidate" includes prereleases such as alpha/beta/rc; "stable"
# only follows non-prerelease releases.
auto_update:
  enabled: false
  channel: "candidate"
  check_interval: "24h"
  repository: "AS214933/dn42-bot"
  data_dir: "/etc/dn42-agent"
  agent_path: "/etc/dn42-agent/agent"
  service_name: "dn42-agent.service"
  service_path: "/etc/systemd/system/dn42-agent.service"
